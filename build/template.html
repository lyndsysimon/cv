<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<meta name="description" content="Lyndsy Simon — principal software engineer. Curriculum vitae.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="page-actions" id="page-actions" aria-label="Page actions">
  <button class="page-actions__toggle" type="button"
          aria-expanded="false" aria-controls="page-actions-list">
    <span class="page-actions__bars" aria-hidden="true"></span>
    <span class="page-actions__label">Menu</span>
  </button>
  <ul class="page-actions__list" id="page-actions-list">
    <li>
      <a href="resume.pdf" download
         title="Download as PDF" aria-label="Download as PDF">
        <svg class="page-actions__icon" viewBox="0 0 24 24"
             aria-hidden="true" focusable="false">
          <path fill-rule="evenodd" d="M5 2h9l5 5v15a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm9.5 1.5V7H18l-3.5-3.5zM11 18 5.5 12.5h3.5V7h4v5.5h3.5L11 18z"/>
        </svg>
        <span class="page-actions__text">Download as PDF</span>
      </a>
    </li>
    <li>
      <a href="https://github.com/lyndsysimon/cv"
         title="View on GitHub" aria-label="View on GitHub">
        <svg class="page-actions__icon" viewBox="0 0 16 16"
             aria-hidden="true" focusable="false">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span class="page-actions__text">View on GitHub</span>
      </a>
    </li>
  </ul>
</nav>
$body$
<script>
(function () {
  var nav = document.getElementById('page-actions');
  var btn = nav.querySelector('.page-actions__toggle');

  function setOpen(open) {
    nav.classList.toggle('is-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  btn.addEventListener('click', function () {
    setOpen(!nav.classList.contains('is-open'));
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && nav.classList.contains('is-open')) {
      setOpen(false);
      btn.focus();
    }
  });

  document.addEventListener('click', function (e) {
    if (nav.classList.contains('is-open') && !nav.contains(e.target)) {
      setOpen(false);
    }
  });

  // Leaving the narrow layout should not strand the menu in a closed state.
  var wide = window.matchMedia('(min-width: 58rem)');
  var onChange = function (e) { if (e.matches) setOpen(false); };
  if (wide.addEventListener) wide.addEventListener('change', onChange);
  else if (wide.addListener) wide.addListener(onChange);
})();
</script>
</body>
</html>
